<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vissiuss — acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0A0A0A;
      --card: #111111;
      --ink: #F4EFE6;
      --muted: #A39A8C;
      --line: #2A2620;
      --accent: #E8DFD0;
      --danger: #C45C4E;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: Outfit, system-ui, sans-serif;
      font-weight: 300;
    }
    .card {
      width: min(440px, calc(100vw - 32px));
      padding: 48px 40px 36px;
      border-top: 1px solid var(--line);
    }
    .brand {
      font-family: "Playfair Display", Georgia, serif;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      font-size: 13px;
      margin: 0 0 28px;
      color: var(--ink);
    }
    h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 500;
      font-size: 40px;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 8px;
    }
    input {
      width: 100%;
      margin-bottom: 18px;
      padding: 12px 0;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font: inherit;
    }
    input:focus { outline: none; border-bottom-color: var(--accent); }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px 16px;
      border: 0;
      background: var(--accent);
      color: var(--bg);
      font-family: Outfit, sans-serif;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 12px;
      cursor: pointer;
    }
    .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 14px; }
  </style>
</head>
<body>
  <form class="card" id="login-form">
    <p class="brand">Vissiuss</p>
    <h1>Admin Scraping TA</h1>
    <p>Acceso a la consola de informes de menú.</p>
    <label for="username">Usuario</label>
    <input id="username" name="username" autocomplete="username" required />
    <label for="password">Clave</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit">Entrar</button>
    <p class="err" id="error"></p>
  </form>
  <script>
    document.getElementById("login-form").onsubmit = async (ev) => {
      ev.preventDefault();
      const error = document.getElementById("error");
      error.textContent = "";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "No se pudo entrar.");
        window.location.href = "/admin";
      } catch (err) {
        error.textContent = String(err.message || err);
      }
    };
  </script>
</body>
</html>
