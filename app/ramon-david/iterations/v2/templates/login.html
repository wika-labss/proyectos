<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal | Acolchados CD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/portales.css">
</head>
<body class="portal-body">
  <header class="portal-top">
    <a class="portal-brand" href="/">ACOLCHADOS CD</a>
    <div class="portal-top-links">
      <a href="/">Sitio público</a>
    </div>
  </header>
  <div class="login-wrap">
    <div class="login-card">
      <p class="crumb">Portal interno</p>
      <h1>Catálogo, stock y <em>reportes</em></h1>
      <p class="lead">Un solo acceso para editar el catálogo, mover existencias y bajar reportes.</p>
      {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
      <form class="login-form" method="post" action="{{ action }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label>Usuario<input name="username" required autofocus autocomplete="username"></label>
        <label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label>
        <button class="btn btn-primary" type="submit">Ingresar</button>
      </form>
    </div>
  </div>
</body>
</html>
