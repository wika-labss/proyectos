<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportes | Portal Acolchados CD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/portales.css">
</head>
<body class="portal-body">
  <header class="portal-top">
    <a class="portal-brand" href="/admin">ACOLCHADOS CD <span>portal</span></a>
    <nav class="portal-nav">
      <a href="/admin">Catálogo</a>
      <a href="/admin/stock">Stock</a>
      <a class="is-active" href="/admin/reportes">Reportes</a>
    </nav>
    <div class="portal-top-links">
      <a href="/">Sitio público</a>
      <span class="portal-user">{{ user }}</span>
      <a href="/admin/logout">Salir</a>
    </div>
  </header>
  <main class="portal-wrap">
    <p class="crumb">Reportes</p>
    <h1>Reportes de stock</h1>
    <p class="lead">Stock actual y movimientos en un rango de fechas. Descarga CSV o revísalo en pantalla.</p>
    <div class="filters">
      <label class="muted">Desde <input type="date" id="desde"></label>
      <label class="muted">Hasta <input type="date" id="hasta"></label>
      <button class="btn btn-primary" type="button" id="btnVer">Ver reporte</button>
      <button class="btn" type="button" id="btnCsv">Descargar CSV</button>
    </div>
    <div class="panel">
      <h2 style="margin:0 0 12px;font-family:var(--serif);font-size:20px">Stock actual</h2>
      <div class="table-wrap">
        <table class="data" id="tblStock"><thead><tr><th>Categoría</th><th>Producto</th><th>Talla</th><th>Unidades</th></tr></thead><tbody></tbody></table>
      </div>
    </div>
    <div class="panel">
      <h2 style="margin:0 0 12px;font-family:var(--serif);font-size:20px">Movimientos</h2>
      <div class="table-wrap">
        <table class="data" id="tblMov"><thead><tr><th>Fecha</th><th>Producto</th><th>Talla</th><th>Delta</th><th>Motivo</th><th>Actor</th></tr></thead><tbody></tbody></table>
      </div>
    </div>
  </main>
  <script>
    function qs() {
      const q = new URLSearchParams();
      if (document.getElementById('desde').value) q.set('desde', document.getElementById('desde').value);
      if (document.getElementById('hasta').value) q.set('hasta', document.getElementById('hasta').value);
      return q.toString();
    }
    document.getElementById('btnVer').addEventListener('click', async () => {
      const res = await fetch('/admin/api/stock/reportes?' + qs());
      const json = await res.json();
      const titles = {};
      (json.stock || []).forEach(r => { titles[r.product_id] = r.title; });
      document.querySelector('#tblStock tbody').innerHTML = (json.stock || []).map(r =>
        `<tr><td>${r.category}</td><td>${r.title}</td><td>${r.size}</td><td class="${r.low ? 'low' : ''}">${r.qty}</td></tr>`
      ).join('');
      const movs = json.movimientos || [];
      document.querySelector('#tblMov tbody').innerHTML = movs.length
        ? movs.map(m => `<tr><td>${(m.at || '').slice(0,19)}</td><td>${titles[m.product_id] || m.product_id}</td><td>${m.size}</td><td>${m.delta}</td><td>${m.motivo || ''}</td><td>${m.actor || ''}</td></tr>`).join('')
        : '<tr><td colspan="6">Sin movimientos en el rango</td></tr>';
    });
    document.getElementById('btnCsv').addEventListener('click', () => {
      location.href = '/admin/api/stock/reportes?format=csv&' + qs();
    });
  </script>
</body>
</html>
